name: Build Wayne Jr APK

on:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project (works with loose files or any zip)
        run: |
          set -e
          if [ -f settings.gradle.kts ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            Z=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
            if [ -z "$Z" ]; then
              echo "No project files and no .zip found in the repo root:"
              ls -la
              exit 1
            fi
            echo "Unzipping $Z"
            mkdir proj
            unzip -q "$Z" -d proj
            S=$(find proj -name settings.gradle.kts | head -n1)
            if [ -z "$S" ]; then
              echo "No settings.gradle.kts inside $Z"
              exit 1
            fi
            echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: cd "$PROJ" && gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wayne-jr-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk

